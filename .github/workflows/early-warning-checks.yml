name: Early Warning validation
on:
  pull_request:
  push:
    branches: [main, paimana-earlyWarning]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triage_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: triage_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U triage_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg2://triage_test:test_only@localhost:5432/triage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/test_early_warnings_ui.cjs
      - run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t paimana-warning-check .
      - name: Verify image assets
        run: >-
          docker run --rm paimana-warning-check python -c
          "from pathlib import Path; import os; assert os.environ['PAIMANA_REVISION'] == '${{ github.sha }}';
          files=['early-warnings.html','js/early-warnings.js','js/warning-ui.js','js/project-warnings.js'];
          assert all((Path('/app/frontend') / f).is_file() for f in files);
          assert b'warning-ui.js?v=cases-3' in Path('/app/frontend/early-warnings.html').read_bytes()"
