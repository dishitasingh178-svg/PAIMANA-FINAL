name: Deploy PAIMANA

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 --decode > /tmp/paimana-key
          chmod 600 /tmp/paimana-key

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /tmp/paimana-key
          script: |
            set -e
            cd ~/paimana

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard ${{ github.sha }}
            export GIT_COMMIT=$(git rev-parse HEAD)
            test "$GIT_COMMIT" = "${{ github.sha }}"

            echo "Rebuilding PAIMANA API..."
            docker compose build --pull paimana-api
            docker compose run --rm paimana-api python -m scripts.migrate_alert_workflow

            echo "Updating PAIMANA API..."
            docker compose up -d --no-deps --force-recreate paimana-api

            echo "Checking containers..."
            docker compose ps

            echo "Checking API health..."
            for attempt in $(seq 1 30); do
              if docker compose exec -T paimana-api python -m scripts.verify_warning_deployment --revision "$GIT_COMMIT"; then
                break
              fi
              test "$attempt" -lt 30
              sleep 2
            done
            docker compose exec -T paimana-api python -m scripts.verify_warning_deployment --revision "$GIT_COMMIT"

            echo "Deployment completed successfully."
