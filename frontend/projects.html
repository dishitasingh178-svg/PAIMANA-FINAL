<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAIMANA AI - Project Portfolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>

<body class="bg-slate-50 dark:bg-[#0A0E17] text-slate-800 dark:text-slate-300 flex min-h-screen antialiased transition-colors duration-200">

  <!-- ================= SIDEBAR ================= -->
  <aside class="w-64 bg-white dark:bg-[#121826] border-r border-slate-200 dark:border-[#1E293B] flex flex-col justify-between p-5 shrink-0 transition-colors duration-200">
    <div>
      <div class="flex items-center gap-3 mb-10 pl-2">
        <div class="w-8 h-8 rounded-lg bg-orange-500/20 text-orange-500 flex items-center justify-center font-bold">
          <i data-lucide="shield-alert" class="w-5 h-5"></i>
        </div>
        <span class="text-lg font-bold text-slate-900 dark:text-white tracking-wide">PAIMANA AI</span>
      </div>

      <nav class="space-y-1 text-sm font-medium">
        <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/50 transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
        </a>
        <a href="projects.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-orange-500 text-white shadow-lg shadow-orange-500/20">
          <i data-lucide="folder-kanban" class="w-4 h-4"></i> Projects
        </a>
        <a href="add-project.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/50 transition">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Project
        </a>
        <a href="risk-analytics.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/50 transition">
          <i data-lucide="line-chart" class="w-4 h-4"></i> Risk Analytics
        </a>
        <a href="early-warnings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/50 transition">
          <i data-lucide="bell" class="w-4 h-4"></i> Early Warnings
        </a>
        <a href="ai-assistant.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/50 transition">
          <i data-lucide="bot" class="w-4 h-4"></i> AI Assistant
        </a>
      </nav>
    </div>
  </aside>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="flex-1 flex flex-col overflow-y-auto h-screen">
    <header class="h-20 border-b border-slate-200 dark:border-[#1E293B] px-8 flex items-center justify-between sticky top-0 bg-white/80 dark:bg-[#0A0E17]/80 backdrop-blur z-20 transition-colors duration-200">
      <div>
        <h1 class="text-xl font-bold text-slate-900 dark:text-white">Project Portfolio</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Explore and filter projects from the PAIMANA database.</p>
      </div>
      <button id="theme-toggle" class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <i id="theme-dark-icon" data-lucide="moon" class="w-5 h-5 hidden"></i>
        <i id="theme-light-icon" data-lucide="sun" class="w-5 h-5 hidden"></i>
      </button>
    </header>

    <div class="p-8 space-y-6 flex-1 flex flex-col">
      
      <!-- Filters Row -->
      <div class="flex flex-wrap gap-4 items-center justify-between bg-white dark:bg-[#121826] p-4 rounded-xl border border-slate-200 dark:border-[#1E293B] shadow-sm transition-colors duration-200">
        
        <div class="relative w-72">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="Search projects, agencies..." class="w-full bg-slate-50 dark:bg-[#0A0E17] border border-slate-200 dark:border-[#1E293B] rounded-lg pl-9 pr-4 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-orange-500 transition-colors">
        </div>
        
        <div class="flex items-center gap-3">
          <select id="statusFilter" class="bg-slate-50 dark:bg-[#0A0E17] border border-slate-200 dark:border-[#1E293B] rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-orange-500 transition-colors">
            <option value="all">All Statuses</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
            <option value="delayed">Delayed</option>
          </select>
          
          <select id="sectorFilter" class="bg-slate-50 dark:bg-[#0A0E17] border border-slate-200 dark:border-[#1E293B] rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-orange-500 transition-colors">
            <option value="all">All Sectors</option>
            <option value="STEEL">Steel</option>
            <option value="RAILWAYS">Railways</option>
            <option value="POWER">Power</option>
            <option value="PETROLEUM">Petroleum</option>
          </select>
        </div>
      </div>

      <!-- The Table Shell -->
      <div class="bg-white dark:bg-[#121826] border border-slate-200 dark:border-[#1E293B] rounded-xl shadow-sm overflow-hidden flex-1 flex flex-col transition-colors duration-200">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="border-b border-slate-200 dark:border-[#1E293B] text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-[#0A0E17]/50">
                <th class="p-4 font-semibold text-xs uppercase tracking-wider">Project Name & Agency</th>
                <th class="p-4 font-semibold text-xs uppercase tracking-wider">Sector</th>
                <th class="p-4 font-semibold text-xs uppercase tracking-wider">Cost (Org → Anti)</th>
                <th class="p-4 font-semibold text-xs uppercase tracking-wider">Milestones</th>
                <th class="p-4 font-semibold text-xs uppercase tracking-wider">Status / AI Risk</th>
                <th class="p-4 font-semibold text-xs uppercase tracking-wider text-right">Action</th>
              </tr>
            </thead>
            <!-- THIS TBODY IS EMPTY ON PURPOSE! JS WILL FILL IT. -->
            <tbody id="projectsTableBody" class="divide-y divide-slate-100 dark:divide-[#1E293B]">
              <!-- Rows get injected here -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  
  <!-- ================= DYNAMIC DATA LOGIC ================= -->
  
  <!-- ================= DYNAMIC DATA LOGIC ================= -->
  <script>
    lucide.createIcons();

    async function fetchProjectsFromAPI() {
      const searchInput = document.getElementById('searchInput');
      const sectorFilter = document.getElementById('sectorFilter');
      const tbody = document.getElementById('projectsTableBody');

      const q = encodeURIComponent(searchInput ? searchInput.value.trim() : '');
      const sector = encodeURIComponent(sectorFilter ? sectorFilter.value : 'all');

      try {
        // Show temporary loading state
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-8 text-center text-slate-400">
              <div class="flex items-center justify-center gap-2">
                <span class="w-2 h-2 rounded-full bg-orange-500 animate-ping"></span>
                Loading projects from database...
              </div>
            </td>
          </tr>
        `;

        const response = await fetch(`${window.location.origin}/api/v1/projects/?q=${q}&sector=${sector}`);
        
        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status}`);
        }
        
        const data = await response.json();
        renderTable(data); 

      } catch (error) {
        console.error("Failed to fetch projects:", error);
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-6 text-center text-red-500">
              Failed to load projects (${error.message}). Check terminal and browser console.
            </td>
          </tr>
        `;
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('projectsTableBody');
      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-8 text-center text-slate-400">
              No projects found matching the criteria.
            </td>
          </tr>
        `;
        return;
      }

      data.forEach(project => {
        const achieved = Number(project.milestones_achieved) || 0;
        const total = Number(project.milestones_total) > 0 ? Number(project.milestones_total) : 100;
        const progressPct = Math.min(100, Math.round((achieved / total) * 100));
        
        // AI Risk tier coloring
        // In projects.html inside renderTable(data):
        // In projects.html inside renderTable(data):
        let badgeColor = "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20";
        const label = (project.risk_label || '').toUpperCase();

        if (label.includes("CRITICAL")) {
          badgeColor = "bg-red-500/10 text-red-600 dark:text-red-400 border-red-500/20";
        } else if (label.includes("ELEVATED") || label.includes("HIGH")) {
          badgeColor = "bg-orange-500/10 text-orange-600 dark:text-orange-400 border-orange-500/20";
        } else if (label.includes("WATCH") || label.includes("MEDIUM")) {
          badgeColor = "bg-yellow-500/10 text-yellow-600 dark:text-yellow-400 border-yellow-500/20";
        }

        const orgCost = Number(project.original_cost || 0).toLocaleString();
        const antiCost = Number(project.anticipated_cost || project.original_cost || 0).toLocaleString();
        const riskScore = Number(project.risk_score || 0).toFixed(1);

        const row = `
          <tr class="hover:bg-slate-50 dark:hover:bg-[#1E293B]/50 transition-colors group">
            <td class="p-4">
              <p class="font-semibold text-slate-900 dark:text-white text-xs truncate max-w-xs" title="${project.name || 'Unnamed Project'}">
                ${project.name || 'Unnamed Project'}
              </p>
              <p class="text-[10px] text-slate-500 dark:text-slate-400 mt-1">
                ${project.agency || 'N/A'} • ID: ${project.id}
              </p>
            </td>
            <td class="p-4 text-xs font-medium text-slate-600 dark:text-slate-300">
              ${project.sector || 'General'}
            </td>
            <td class="p-4 text-xs">
              <p class="font-semibold text-slate-900 dark:text-white">₹${orgCost} Cr</p>
              <p class="text-[10px] text-slate-500 dark:text-slate-400 mt-1">→ ₹${antiCost} Cr</p>
            </td>
            <td class="p-4 w-48">
              <div class="flex items-center justify-between text-[10px] mb-1">
                <span class="text-slate-500 dark:text-slate-400">${achieved} / ${total} Achieved</span>
                <span class="font-bold text-slate-700 dark:text-slate-300">${progressPct}%</span>
              </div>
              <div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                <div class="bg-orange-500 h-full" style="width: ${progressPct}%"></div>
              </div>
            </td>
            <td class="p-4">
              <span class="px-2 py-1 border rounded-md text-[10px] font-bold uppercase tracking-wider ${badgeColor}">
                ${riskScore}/100 • ${project.risk_label || 'LOW'}
              </span>
            </td>
            <td class="p-4 text-right">
              <a href="project-details.html?id=${project.id}" class="text-orange-600 dark:text-orange-500 hover:underline text-xs font-semibold">
                View Details →
              </a>
            </td>
          </tr>
        `;
        
        tbody.innerHTML += row;
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchProjectsFromAPI();

      const searchInput = document.getElementById('searchInput');
      const sectorFilter = document.getElementById('sectorFilter');

      let debounceTimer;
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(fetchProjectsFromAPI, 300);
        });
      }

      if (sectorFilter) {
        sectorFilter.addEventListener('change', fetchProjectsFromAPI);
      }
    });
  </script>
</body>
</html>
