<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAIMANA AI - Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <script src="js/theme.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>

<body class="bg-slate-50 dark:bg-[#0A0E17] text-slate-800 dark:text-slate-300 flex min-h-screen antialiased transition-colors duration-200">

  <!-- Left Side: Branding & Vision -->
  <div class="hidden lg:flex flex-1 flex-col justify-center px-24 relative overflow-hidden bg-white dark:bg-[#121826] border-r border-slate-200 dark:border-[#1E293B] transition-colors duration-200">
    <!-- Decorative glow -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-orange-500/10 rounded-full blur-3xl"></div>
    
    <div class="relative z-10 space-y-6">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-10 h-10 rounded-xl bg-orange-500 text-white flex items-center justify-center font-bold shadow-lg shadow-orange-500/20">
          <i data-lucide="shield-alert" class="w-6 h-6"></i>
        </div>
        <span class="text-2xl font-bold text-slate-900 dark:text-white tracking-wide">PAIMANA AI</span>
      </div>
      
      <h1 class="text-4xl font-bold text-slate-900 dark:text-white leading-tight">
        Building a stronger India <br> through smarter decisions.
      </h1>
      <p class="text-slate-500 dark:text-slate-400 text-lg max-w-md leading-relaxed">
        "Infrastructure is the foundation of a brighter tomorrow." Navigate 1,981 projects with predictive intelligence.
      </p>
    </div>
  </div>

  <!-- Right Side: Login Form -->
  <div class="flex-1 flex flex-col justify-center items-center px-8 relative">
    
    <!-- Theme Toggle (Top Right) -->
    <button id="theme-toggle" class="absolute top-8 right-8 p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
      <i id="theme-dark-icon" data-lucide="moon" class="w-5 h-5 hidden"></i>
      <i id="theme-light-icon" data-lucide="sun" class="w-5 h-5 hidden"></i>
    </button>

    <div class="w-full max-w-md space-y-8">
      <div class="text-center">
        <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Welcome Back</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Sign in to access the platform</p>
      </div>

      <form class="space-y-5" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-600 dark:text-slate-400">Email Address</label>
          <input type="email" value="admin@gov.in" required class="w-full bg-white dark:bg-[#121826] border border-slate-200 dark:border-[#1E293B] rounded-lg px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-orange-500 transition-colors">
        </div>
        
        <div class="space-y-2">
          <div class="flex justify-between">
            <label class="text-xs font-semibold text-slate-600 dark:text-slate-400">Password</label>
            <a href="#" class="text-xs text-orange-600 dark:text-orange-500 hover:underline">Forgot password?</a>
          </div>
          <input type="password" value="••••••••" required class="w-full bg-white dark:bg-[#121826] border border-slate-200 dark:border-[#1E293B] rounded-lg px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-orange-500 transition-colors">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition-colors flex justify-center items-center mt-6">
          Sign In
        </button>
        
        <button type="button" class="w-full bg-white dark:bg-[#121826] border border-slate-200 dark:border-[#1E293B] hover:bg-slate-50 dark:hover:bg-[#1E293B]/50 text-slate-900 dark:text-white font-semibold py-3 rounded-lg transition-colors flex justify-center items-center gap-2">
          <i data-lucide="fingerprint" class="w-4 h-4"></i> Sign in with SSO
        </button>
      </form>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
