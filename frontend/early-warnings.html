<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAIMANA AI - Early Warning Center</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  
  <!-- Prevent Flash of Unstyled Content -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@11.13.5/dist/motion.js"></script>
  <link rel="stylesheet" href="css/custom.css">

<style id="paimana-claude-motion">
  /* ============================================================
     PAIMANA visual layer only
     No API, navigation, auth, theme or business logic is changed.
     ============================================================ */
  :root {
    --pm-orange: #f97316;
    --pm-radar-opacity: .34;
    --pm-grid: rgba(100,116,139,.075);
    --pm-ambient: rgba(249,115,22,.075);
    --pm-sweep: rgba(249,115,22,.16);
  }
  .dark {
    --pm-radar-opacity: .48;
    --pm-grid: rgba(148,163,184,.055);
    --pm-ambient: rgba(249,115,22,.07);
    --pm-sweep: rgba(249,115,22,.22);
  }

  /* Claude-style ambient control-room backdrop + the moving radar. */
  main {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    background:
      radial-gradient(circle at 18% 8%, var(--pm-ambient), transparent 28%),
      radial-gradient(circle at 82% 18%, rgba(239,68,68,.045), transparent 25%),
      radial-gradient(circle at 55% 90%, rgba(59,130,246,.035), transparent 30%);
  }

  main::before {
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:-3;
    opacity:1;
    background-image:
      linear-gradient(var(--pm-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--pm-grid) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image: linear-gradient(to bottom, black, transparent 90%);
    mask-image: linear-gradient(to bottom, black, transparent 90%);
  }

  /* Large, ambient radar exactly as a backdrop, not a data widget. */
  main .pm-radar-backdrop {
    position:absolute;
    top: 50%;
    left: 55%;
    width: min(920px, 105vw);
    height: min(920px, 105vw);
    transform: translate(-50%, -50%);
    border-radius:50%;
    pointer-events:none;
    z-index:-2;
    opacity:var(--pm-radar-opacity);
    background:
      radial-gradient(circle at center,
        transparent 0 8.5%,
        rgba(148,163,184,.12) 8.7%, transparent 9.1%,
        transparent 25%,
        rgba(148,163,184,.10) 25.2%, transparent 25.6%,
        transparent 50%,
        rgba(148,163,184,.10) 50.2%, transparent 50.6%,
        transparent 74%,
        rgba(148,163,184,.11) 74.2%, transparent 74.6%,
        transparent 94%,
        rgba(148,163,184,.12) 94.2%, transparent 94.7%),
      linear-gradient(90deg, transparent 49.85%, rgba(148,163,184,.10) 49.95%, rgba(148,163,184,.10) 50.05%, transparent 50.15%),
      linear-gradient(0deg, transparent 49.85%, rgba(148,163,184,.10) 49.95%, rgba(148,163,184,.10) 50.05%, transparent 50.15%);
    -webkit-mask-image: radial-gradient(circle, black 0 65%, transparent 82%);
    mask-image: radial-gradient(circle, black 0 65%, transparent 82%);
  }

  main .pm-radar-backdrop::before {
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 318deg,
      var(--pm-sweep) 342deg,
      rgba(249,115,22,.045) 356deg,
      transparent 360deg
    );
    animation:pmRadarSweep 8s linear infinite;
    transform-origin:center;
  }

  main .pm-radar-backdrop::after {
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:var(--pm-orange);
    box-shadow:0 0 0 6px rgba(249,115,22,.055), 0 0 22px rgba(249,115,22,.38);
    animation:pmRadarCore 3.2s ease-in-out infinite;
  }

  @keyframes pmRadarSweep { to { transform:rotate(360deg); } }
  @keyframes pmRadarCore {
    0%,100% { opacity:.45; transform:translate(-50%,-50%) scale(.8); }
    50% { opacity:.95; transform:translate(-50%,-50%) scale(1.15); }
  }

  /* Decorative radar blips. These are visual only, never project data. */
  .pm-radar-blip {
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--pm-orange);
    box-shadow:0 0 14px rgba(249,115,22,.72);
    animation:pmBlip 2.7s ease-in-out infinite;
  }
  .pm-radar-blip.b1 { left:67%; top:28%; animation-delay:.2s; }
  .pm-radar-blip.b2 { left:29%; top:62%; animation-delay:1.1s; }
  .pm-radar-blip.b3 { left:62%; top:73%; animation-delay:1.7s; }
  .pm-radar-blip.b4 { left:38%; top:35%; animation-delay:2.1s; }
  @keyframes pmBlip {
    0%,100% { opacity:.12; transform:scale(.55); }
    42%,65% { opacity:.9; transform:scale(1); }
  }

  /* Keep real UI above the decorative radar. */
  main > header,
  main > .p-4,
  main > .md\\:p-8 { position:relative; z-index:1; }

  #sidebar {
    box-shadow:10px 0 35px rgba(2,6,23,.035);
  }
  #sidebar > div:first-child > div:first-child > div {
    animation:pmLogoPulse 3.2s ease-in-out infinite;
  }
  @keyframes pmLogoPulse {
    0%,100% { box-shadow:0 0 0 0 rgba(249,115,22,0); }
    50% { box-shadow:0 0 0 7px rgba(249,115,22,.045); }
  }

  #sidebar nav a {
    position:relative;
    overflow:hidden;
    transform:translateZ(0);
  }
  #sidebar nav a::after {
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,.08) 50%, transparent 65%);
    transform:translateX(-120%);
    transition:transform .55s ease;
    pointer-events:none;
  }
  #sidebar nav a:hover::after { transform:translateX(120%); }

  header { position:sticky; }
  header::after {
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(249,115,22,.55), transparent);
    opacity:.55;
    animation:pmHeaderScan 4s ease-in-out infinite;
  }
  @keyframes pmHeaderScan {
    0%,100% { transform:scaleX(.2); opacity:.18; }
    50% { transform:scaleX(.75); opacity:.7; }
  }

  #alerts-container > * { will-change:transform, opacity; }
  #alerts-container > div.bg-white {
    position:relative;
    overflow:hidden;
    transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, border-color .28s ease;
  }
  #alerts-container > div.bg-white::before {
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(115deg, transparent 0%, rgba(255,255,255,.045) 45%, transparent 58%);
    transform:translateX(-120%);
    transition:transform .7s ease;
  }
  #alerts-container > div.bg-white:hover {
    transform:translateY(-3px);
    box-shadow:0 14px 38px rgba(15,23,42,.08);
  }
  #alerts-container > div.bg-white:hover::before { transform:translateX(120%); }

  .p-micro-enter { animation:pmAlertEnter .55s cubic-bezier(.22,1,.36,1) both; }
  @keyframes pmAlertEnter {
    from { opacity:0; transform:translateY(13px) scale(.985); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }

  #alerts-container a {
    transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease;
  }
  #alerts-container a:hover { transform:translateY(-1px); }

  @media (max-width: 767px) {
    main .pm-radar-backdrop {
      left:62%;
      width:620px;
      height:620px;
      opacity:calc(var(--pm-radar-opacity) * .72);
    }
  }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after {
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      scroll-behavior:auto !important;
      transition-duration:.001ms !important;
    }
  }
</style>

</head>

<body class="bg-slate-50 dark:bg-[#0A0E17] text-slate-800 dark:text-slate-300 flex min-h-screen antialiased transition-colors duration-200">

  <!-- Mobile sidebar backdrop -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full transition-transform duration-200 ease-in-out lg:static lg:translate-x-0 bg-white dark:bg-[#121826] border-r border-slate-200 dark:border-[#1E293B] flex flex-col justify-between p-5 shrink-0 transition-colors duration-200 overflow-y-auto">
    <div>
      <div class="flex items-center gap-3 mb-10 pl-2">
        <div class="w-8 h-8 rounded-lg bg-orange-500/20 text-orange-500 flex items-center justify-center font-bold">
          <i data-lucide="shield-alert" class="w-5 h-5"></i>
        </div>
        <span class="text-lg font-bold text-slate-900 dark:text-white tracking-wide">PAIMANA AI</span>
      </div>

      <nav class="space-y-1 text-sm font-medium">
        <a href="dashboard.html" data-hover-lift class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/50 transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
        </a>
        <a href="projects.html" data-hover-lift class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/50 transition">
          <i data-lucide="folder-kanban" class="w-4 h-4"></i> Projects
        </a>
        <a href="add-project.html" data-role="admin" data-hover-lift class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/50 transition">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Project
        </a>
        <a href="risk-analytics.html" data-hover-lift class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/50 transition">
          <i data-lucide="line-chart" class="w-4 h-4"></i> Risk Analytics
        </a>
        <a href="early-warnings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-orange-500 text-white shadow-lg shadow-orange-500/20">
          <i data-lucide="bell" class="w-4 h-4"></i> Early Warnings
        </a>
        <a href="ai-assistant.html" data-hover-lift class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/50 transition">
          <i data-lucide="bot" class="w-4 h-4"></i> AI Assistant
        </a>
      </nav>
    </div>
  </aside>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="flex-1 flex flex-col overflow-y-auto h-screen min-w-0">
    <div class="pm-radar-backdrop" aria-hidden="true">
      <span class="pm-radar-blip b1"></span>
      <span class="pm-radar-blip b2"></span>
      <span class="pm-radar-blip b3"></span>
      <span class="pm-radar-blip b4"></span>
    </div>
    <header class="h-20 border-b border-slate-200 dark:border-[#1E293B] px-4 md:px-8 flex items-center justify-between sticky top-0 bg-white/80 dark:bg-[#0A0E17]/80 backdrop-blur z-20 transition-colors duration-200">
      <div class="flex items-center gap-3 min-w-0">
        <button id="sidebar-toggle" class="lg:hidden shrink-0 p-2 -ml-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <div class="min-w-0">
          <h1 class="text-lg md:text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2 truncate">
            Early Warning Center 
            <span class="flex h-3 w-3 relative ml-2 shrink-0">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
            </span>
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 hidden sm:block">Real-time alerts triggered by AI predictive models.</p>
        </div>
      </div>
      <button id="theme-toggle" class="shrink-0 p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <i id="theme-dark-icon" data-lucide="moon" class="w-5 h-5 hidden"></i>
        <i id="theme-light-icon" data-lucide="sun" class="w-5 h-5 hidden"></i>
      </button>
    </header>

    <div class="p-4 md:p-8 max-w-5xl mx-auto w-full space-y-6">
      

      <!-- Filter Tabs -->
      <div class="flex items-center gap-2 border-b border-slate-200 dark:border-[#1E293B] pb-4 text-xs font-medium">
        <button class="px-4 py-2 rounded-lg bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-sm">All Alerts</button>
        <button class="px-4 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Critical <span id="count-critical" class="ml-1 bg-red-500 text-white px-1.5 py-0.5 rounded-full text-[10px]">0</span></button>
        <button class="px-4 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">High <span id="count-high" class="ml-1 bg-orange-500 text-white px-1.5 py-0.5 rounded-full text-[10px]">0</span></button>
      </div>

      <!-- Alerts Feed Container (This starts empty, JS fills it) -->
      <div class="space-y-4" id="alerts-container">
        <div class="text-center py-10 text-slate-500 text-sm">
          <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-3"></i>
          Loading real-time alerts from AI Engine...
        </div>
      </div>

    </div>
  </main>

  <!-- Use the global theme script so you don't need inline toggle logic! -->
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/animations.js"></script>
  
  <!-- ================= DYNAMIC DATA FETCH LOGIC ================= -->
  <script>
    lucide.createIcons();

    // Dynamic Alert Fetching
    async function loadEarlyWarnings() {
      const container = document.getElementById('alerts-container');
      
      try {
        const response = await fetch(`${window.location.origin}/api/v1/alerts`); 
        
        if (!response.ok) throw new Error("API failed");
        
        const alerts = await response.json();
        
        container.innerHTML = '';

        if (alerts.length === 0) {
          container.innerHTML = `<p class="text-sm text-slate-500 text-center py-6">No active early warnings found.</p>`;
          return;
        }

        let criticalCount = 0;
        let highCount = 0;

        alerts.forEach((alert, index) => {
          const isCritical = alert.severity.toLowerCase() === 'critical';
          const colorClass = isCritical ? 'bg-red-500' : 'bg-orange-500';
          const textClass = isCritical ? 'text-red-600 dark:text-red-400' : 'text-orange-600 dark:text-orange-400';
          const borderClass = isCritical ? 'border-red-500/20' : 'border-orange-500/20';
          const bgSubtleClass = isCritical ? 'bg-red-500/10' : 'bg-orange-500/10';
          const iconClass = isCritical ? 'text-red-500' : 'text-orange-500';
          
          if (isCritical) criticalCount++;
          else highCount++;

          const card = `
            <div class="bg-white dark:bg-[#121826] border border-slate-200 dark:border-[#1E293B] rounded-xl shadow-sm overflow-hidden flex flex-col md:flex-row transition-colors duration-200 p-micro-enter" style="animation-delay:${Math.min(index * 70, 420)}ms;">
              <div class="w-full md:w-2 ${colorClass} shrink-0"></div>
              <div class="p-6 flex-1 flex flex-col md:flex-row justify-between gap-6">
                <div class="space-y-3 flex-1">
                  <div class="flex items-center gap-3">
                    <span class="px-2 py-1 ${bgSubtleClass} ${textClass} border ${borderClass} rounded text-[10px] font-bold uppercase tracking-wider">${alert.severity} Risk</span>
                    <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">ID: ${alert.project_id} • ${alert.sector}</span>
                  </div>
                  <div>
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white">${alert.project_name}</h3>
                    <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">${alert.issue_summary}</p>
                  </div>
                  <div class="flex items-center gap-2 mt-2 bg-slate-50 dark:bg-[#0A0E17] border border-slate-100 dark:border-[#1E293B] p-3 rounded-lg">
                    <i data-lucide="${isCritical ? 'trending-up' : 'calendar-off'}" class="w-4 h-4 ${iconClass} shrink-0"></i>
                    <span class="text-xs text-slate-700 dark:text-slate-300"><strong>Trigger:</strong> ${alert.trigger_reason}</span>
                  </div>
                </div>
                <div class="flex flex-col items-start md:items-end justify-between shrink-0">
                  <span class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> Just now</span>
                  <a href="project-details.html?id=${alert.project_id}" class="mt-4 md:mt-0 px-4 py-2 ${isCritical ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:bg-slate-800 dark:hover:bg-slate-200' : 'border border-slate-200 dark:border-[#1E293B] hover:bg-slate-50 dark:hover:bg-[#0A0E17] text-slate-900 dark:text-white'} font-medium rounded-lg transition text-xs flex items-center gap-2">
                    ${isCritical ? 'Investigate Details <i data-lucide="arrow-right" class="w-3 h-3"></i>' : 'Acknowledge Alert'}
                  </a>
                </div>
              </div>
            </div>
          `;
          container.innerHTML += card;
        });

        PaimanaFX.countUp(document.getElementById('count-critical'), criticalCount, { duration: 600 });
        PaimanaFX.countUp(document.getElementById('count-high'), highCount, { duration: 600 });

        lucide.createIcons();
        PaimanaFX.staggerIn(container.children);

      } catch (error) {
        console.error("Failed to load alerts from backend:", error);
        container.innerHTML = `
          <div class="p-6 bg-red-500/10 border border-red-500/20 rounded-xl text-center">
            <p class="text-sm text-red-600 dark:text-red-400 font-medium">Failed to connect to the AI Engine.</p>
            <p class="text-xs text-red-500/80 mt-1">Check if the FastAPI backend is running.</p>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadEarlyWarnings();
    });
  </script>
</body>
</html>
